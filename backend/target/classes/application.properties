# Server
# Cloud Run injects PORT automatically; 8080 matches the Dockerfile EXPOSE and local default
server.port=${PORT:8080}

# MySQL Database
# All three now come from environment variables so no real credentials are ever committed.
# Locally, create a .env or export these before running, or just edit the fallback values below for local dev only.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sim_activation_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:0golda7bts@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Logging
logging.level.com.simportal=DEBUG
